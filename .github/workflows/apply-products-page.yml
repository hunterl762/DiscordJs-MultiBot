name: Apply Products Page
on:
  push:
    branches:
      - fix/account-dropdown-add-bot-v2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-dropdown-add-bot-v2
      - name: Apply dashboard patch
        run: node scripts/applyProductsPage.js
      - name: Commit generated dashboard changes
        run: |
          rm -f .github/workflows/apply-products-page.yml scripts/applyProductsPage.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/server.js .github/workflows/apply-products-page.yml scripts/applyProductsPage.js
          git commit -m "Add Discord SKU products checkout page"
          git push origin HEAD:fix/account-dropdown-add-bot-v2

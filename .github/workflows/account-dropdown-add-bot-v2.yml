name: Account Dropdown Add Bot Fix

on:
  push:
    branches:
      - fix/account-dropdown-add-bot-v2

permissions:
  contents: write

jobs:
  patch-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-dropdown-add-bot-v2
          fetch-depth: 0

      - name: Move Add Bot action into signed-in account dropdown
        shell: python
        run: |
          from pathlib import Path

          server = Path('src/dashboard/server.js')
          text = server.read_text(encoding='utf-8')

          settings_link = '          <a class="account-menu-item" href="/dashboard/user-settings">User Settings</a>'
          add_bot_link = '          ${renderAddBotButton().replace(\'class="btn add-bot-button compact"\', \'class="account-menu-item account-add-bot"\')}'
          if add_bot_link not in text:
              if settings_link not in text:
                  raise SystemExit('Account dropdown anchor not found')
              text = text.replace(settings_link, add_bot_link + '\n' + settings_link, 1)

          old_header = '  <div class="header-actions">${addBotButton}<div class="header-auth">${auth}</div></div>'
          new_header = '  <div class="header-actions">${user ? \'\' : addBotButton}<div class="header-auth">${auth}</div></div>'
          if old_header in text:
              text = text.replace(old_header, new_header, 1)
          elif new_header not in text:
              raise SystemExit('Header Add Bot anchor not found')

          server.write_text(text, encoding='utf-8')

          css = Path('public/navigation.css')
          styles = css.read_text(encoding='utf-8')
          marker = '/* Signed-in Add Bot dropdown action */'
          if marker not in styles:
              styles += '''\n\n/* Signed-in Add Bot dropdown action */\n.site-header .account-dropdown-menu .account-add-bot{width:100%!important;min-width:0!important;max-width:none!important;justify-content:flex-start!important;white-space:nowrap!important}\n@media(max-width:620px){.site-header .account-dropdown-menu .account-add-bot{min-height:46px!important;padding:11px 12px!important}}\n'''
          css.write_text(styles, encoding='utf-8')

          workflow = Path('.github/workflows/account-dropdown-add-bot-v2.yml')
          workflow.unlink(missing_ok=True)

      - name: Commit navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/server.js public/navigation.css .github/workflows/account-dropdown-add-bot-v2.yml
          git diff --cached --quiet && exit 0
          git commit -m "Move Add Bot action into account dropdown"
          git push origin HEAD:fix/account-dropdown-add-bot-v2
